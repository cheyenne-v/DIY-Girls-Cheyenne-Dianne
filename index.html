<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Assistant Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ==============================================
         STUDENTS: EDIT THIS HEADER!
         ============================================== -->
    <div class="header">
        <div class="header__badge" aria-hidden="true"></div>
        <h1>Donkey</h1>
        <p>Built by: Cheyenne & Dianne </p>
        <span class="header__status">Online &amp; ready</span>
    </div>

    <div class="container">
        <!-- Configuration Panel -->
        <!-- Hidden from visitors. The fields below stay in the page because
             script.js reads the system prompt and welcome message from them. -->
        <div class="config-panel" hidden>
            <!-- <h2>⚙️ Configure Your Assistant</h2>

            <div class="info-box">
                <strong>Instructions:</strong> Fill in these fields to customize how your AI assistant behaves.
            </div> -->

            <div class="config-section">
                <label for="assistantName">Assistant Name:</label>
                <input
                    type="text"
                    id="Hey there I am Donkey! I bet you have seen a housefly, but this is a Donkey that flies."
                    placeholder="e.g., TrailGuide, StudyBuddy, CampingPro"
                    value="MyAssistant"
                >
            </div>

            <div class="config-section">
                <label for="systemPrompt">System Prompt (What should your assistant do?):</label>
                <textarea
                    id="systemPrompt"
                    placeholder="Example: You are a helpful trail safety advisor. You provide advice about hiking, camping safety, and outdoor preparedness. Always be encouraging and emphasize safety first."
                >You are Donkey from Shrek. who is an unlicensed therapist that provides advice. This ranges from personal emotions to social interactions with others.You are a 20 year old Donkey, and showed up because you were being sold off to the civilians of Duloc. You have an encouraging, energetic, and goofy personality. You saw "hee-haw" for every other response. You check in with how the person is doing, provide advice, but don't tell them they should actually do it. It is an optional choice. Ask one check up question before they go to make sure everything they are feeling is okay. Tell them it is okay to be feeling a certain way because it's important to them, and they matter. Don't go off topic to what is listed, and redirect them to their emotions because you only know things that are related to emotional situations. If you don't know an answer say, "I'm going to make waffles and go check in with someone else." </textarea>
            </div>

            <div class="config-section">
                <label for="welcomeMessage">Welcome Message:</label>
                <input
                    type="text"
                    id="welcomeMessage"
                    placeholder="What should your assistant say when it starts?"
                    value="Hello! How can I help you today?"
                >
            </div>
        </div>

        <!-- Chat Interface -->
        <div class="chat-container">
            <div class="messages" id="messages">
                <!-- Messages will appear here -->
            </div>
            <div class="input-area">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Type your message here..."
                    onkeypress="if(event.key === 'Enter') sendMessage()"
                >
                <button onclick="sendMessage()" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
